pid /tmp/nginx.pid;
worker_processes auto;
# Ordinary upstream errors include raw URIs in nginx error messages; access JSON records their status.
error_log /dev/stderr crit;
events { worker_connections 512; }
http {
 include /etc/b06/admission.conf;
 include /etc/nginx/mime.types;
 default_type application/octet-stream;
 log_format observation escape=json '{"event":"http_access","service":"web","requestId":"$upstream_http_x_request_id","status":$status,"durationSeconds":$request_time}';
 access_log /dev/stdout observation;
 server_tokens off;
 client_body_temp_path /tmp/client;
 proxy_temp_path /tmp/proxy;
 fastcgi_temp_path /tmp/fastcgi;
 uwsgi_temp_path /tmp/uwsgi;
 scgi_temp_path /tmp/scgi;
 # Docker DNS, re-resolved after B container replacement.
 resolver 127.0.0.11 valid=10s ipv6=off;
 server {
  listen 8443 ssl;
  server_name zj-market-ux.test;
  ssl_certificate /run/secrets/web-cert.pem;
  ssl_certificate_key /run/secrets/web-key.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy same-origin always;
  root /usr/share/nginx/html;
  location = /internal/health/live { return 404; }
  location ^~ /internal/ { return 404; }
  location = /healthz { access_log off; return 200 'UP'; }
  location ^~ /api/ {
   if ($b06_block_new) { return 503; }
   set $backend http://market-b:8080;
   proxy_pass $backend$request_uri;
   proxy_set_header Host $host;
   proxy_set_header Origin $http_origin;
   proxy_set_header X-Forwarded-Proto https;
   proxy_set_header X-Forwarded-Host $host;
   proxy_set_header X-Forwarded-For $remote_addr;
   proxy_connect_timeout 3s;
   proxy_read_timeout 30s;
   client_max_body_size 1m;
  }
  location / { try_files $uri $uri/ /index.html; }
 }
}
