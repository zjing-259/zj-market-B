thread.pool.executor.config.max-pool-size=8
thread.pool.executor.config.keep-alive-time=5000
thread.pool.executor.config.block-queue-size=100
thread.pool.executor.config.policy=AbortPolicy
dubbo.application.name=marketing-a-b06
dubbo.registry.address=N/A
dubbo.protocol.name=tri
dubbo.protocol.host=0.0.0.0
dubbo.protocol.port=50051
dubbo.protocol.ssl-enabled=true
dubbo.ssl.server-key-cert-chain-path=/run/secrets/rpc-server.pem
dubbo.ssl.server-private-key-path=/run/secrets/rpc-server-key.pem
dubbo.ssl.server-trust-cert-collection-path=/run/secrets/rpc-client-ca.pem
ab.v2.enabled=true
ab.v2.env=b06
ab.v2.dubbo-group=gbm-b06
