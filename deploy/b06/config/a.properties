# This entirely replaces packaged application profiles; secret values live in a separate file.
spring.application.name=group-buy-market-b06
server.port=8080
spring.datasource.url=jdbc:mysql://mysql:3306/group_buy_market_b06?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&sslMode=VERIFY_IDENTITY&trustCertificateKeyStoreUrl=file:/run/secrets/mysql-trust.p12&trustCertificateKeyStoreType=PKCS12
spring.datasource.username=a_runtime
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=5000
mybatis.config-location=classpath:mybatis/config/mybatis-config.xml
