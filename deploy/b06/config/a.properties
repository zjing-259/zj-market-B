ab.v2.rocketmq.require-tls=true
ab.v2.mq.a-key-id=b06-a-1
ab.v2.mq.b-key-id=b06-b-1
ab.v2.legacy-new-orders-enabled=false
ab.v2.legacy-http-protection-enabled=true
