# Default-deny API mutations; allow identity, cancellation and existing operator recovery.
map "$request_method:$uri" $b06_block_new {
 default 0;
 ~^(POST|PUT|PATCH|DELETE):/api/v1/auth/ 0;
 ~^POST:/api/v1/products/[^/]+/trial/?$ 0;
 ~^POST:/api/v1/orders/[^/]+/cancel/?$ 0;
 ~^POST:/api/v1/admin/(orders/[^/]+/coordination-controls|refunds/[^/]+/controls)/?$ 0;
 ~^(POST|PUT|PATCH|DELETE):/api/ 1;
}
