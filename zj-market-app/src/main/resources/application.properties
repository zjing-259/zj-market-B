spring.application.name=zj-market
spring.config.import=classpath:infrastructure/rpc.properties,classpath:infrastructure/mq.properties,classpath:infrastructure/database.properties

spring.autoconfigure.exclude=org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration,org.mybatis.spring.boot.autoconfigure.MybatisAutoConfiguration
spring.jackson.deserialization.fail-on-unknown-properties=true
b.identity.enabled=${B_IDENTITY_ENABLED:false}
b.identity.origin=${B_IDENTITY_ORIGIN:}
b.identity.secure-cookies=${B_IDENTITY_SECURE_COOKIES:true}
b.identity.key-id=${B_IDENTITY_KEY_ID:}
b.identity.private-key-file=${B_IDENTITY_PRIVATE_KEY_FILE:}
b.identity.public-key-file=${B_IDENTITY_PUBLIC_KEY_FILE:}
b.identity.previous-public-keys=${B_IDENTITY_PREVIOUS_PUBLIC_KEYS:}
b.identity.issuer=${B_IDENTITY_ISSUER:zj-market}
b.identity.audience=${B_IDENTITY_AUDIENCE:zj-market-web}
b.identity.access-seconds=${B_IDENTITY_ACCESS_SECONDS:900}
b.identity.refresh-seconds=${B_IDENTITY_REFRESH_SECONDS:604800}
b.identity.rate.ip-limit=${B_IDENTITY_RATE_IP_LIMIT:20}
b.identity.rate.login-limit=${B_IDENTITY_RATE_LOGIN_LIMIT:5}
b.identity.rate.window-seconds=${B_IDENTITY_RATE_WINDOW_SECONDS:60}

b.product.enabled=${B_PRODUCT_ENABLED:false}
b.product.event-producer=${B_PRODUCT_EVENT_PRODUCER:${B_MQ_PRODUCER_ID:${AB_V2_RPC_CLIENT_ID:}}}
b.product.event-source=${B_PRODUCT_EVENT_SOURCE:${B_MQ_SOURCE:}}
b.product.event-channel=${B_PRODUCT_EVENT_CHANNEL:${B_MQ_CHANNEL:}}

b.sync.enabled=${B_SYNC_ENABLED:false}
b.sync.scheduler-enabled=${B_SYNC_SCHEDULER_ENABLED:true}
b.sync.accelerated-test=${B_SYNC_ACCELERATED_TEST:false}
b.sync.scan-millis=${B_SYNC_SCAN_MILLIS:2000}
b.sync.lease-millis=${B_SYNC_LEASE_MILLIS:30000}
b.sync.query-millis=${B_SYNC_QUERY_MILLIS:30000}
b.sync.batch-size=${B_SYNC_BATCH_SIZE:20}
b.sync.max-reconsume-times=${B_SYNC_MAX_RECONSUME_TIMES:8}
b.sync.previous-a-keys=${B_SYNC_PREVIOUS_A_KEYS:}

b.trial.enabled=${B_TRIAL_ENABLED:false}

b.inventory.enabled=${B_INVENTORY_ENABLED:false}

b.order.enabled=${B_ORDER_ENABLED:false}
# D6: only new local orders; D9 confirmation TTL and A payment deadline remain independent.
b.order.reserve-wait-millis=${B_ORDER_RESERVE_WAIT_MILLIS:300000}

b.trade.enabled=${B_TRADE_ENABLED:false}
b.trade.scheduler-enabled=${B_TRADE_SCHEDULER_ENABLED:true}
b.trade.scan-millis=${B_TRADE_SCAN_MILLIS:2000}
b.trade.batch-size=${B_TRADE_BATCH_SIZE:20}
b.trade.lease-millis=${B_TRADE_LEASE_MILLIS:30000}

b.trade.retry-base-millis=${B_TRADE_RETRY_BASE_MILLIS:2000}
b.trade.retry-max-millis=${B_TRADE_RETRY_MAX_MILLIS:30000}

# Payment infrastructure and ordinary writes have separate gates. Recovery ignores checkout-disabled.
b.payment.enabled=${B_PAYMENT_ENABLED:false}
b.payment.checkout-enabled=${B_PAYMENT_CHECKOUT_ENABLED:false}
b.payment.scheduler-enabled=${B_PAYMENT_SCHEDULER_ENABLED:true}
b.payment.max-query-rtt-millis=${B_PAYMENT_MAX_QUERY_RTT_MILLIS:2000}
b.payment.time-evidence-ttl-millis=${B_PAYMENT_TIME_EVIDENCE_TTL_MILLIS:2000}
b.payment.max-clock-skew-millis=${B_PAYMENT_MAX_CLOCK_SKEW_MILLIS:2000}

# Independent reliable payment facts; checkout remains disabled until later stages.
b.trade.events-enabled=${B_TRADE_EVENTS_ENABLED:false}
b.trade.events-scheduler-enabled=${B_TRADE_EVENTS_SCHEDULER_ENABLED:true}
b.trade.event-topic=${B_MQ_TRADE_TOPIC:}
b.trade.result-group=${B_MQ_TRADE_RESULT_GROUP:}
b.trade.team-group=${B_MQ_TRADE_TEAM_GROUP:}
