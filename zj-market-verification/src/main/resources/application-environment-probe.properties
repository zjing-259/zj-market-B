# This resource is packaged only in the verification executable.
b.verification.enabled=true
b.verification.environment=dev
b.verification.report=${B_PROBE_REPORT:target/environment-probe/report.json}
b.infrastructure.rpc.enabled=true
b.infrastructure.rpc.url=${B_PROBE_RPC_URL:tri://127.0.0.1:50051?ssl-enabled=true}
b.infrastructure.rpc.group=gbm-dev
b.infrastructure.rpc.source=${AB_V2_RPC_SOURCE:s01}
b.infrastructure.rpc.channel=${AB_V2_RPC_CHANNEL:c01}
b.infrastructure.rpc.trust-certificate=${AB_V2_TLS_CLIENT_CERT:}
b.infrastructure.mq.enabled=true
b.infrastructure.mq.nameserver=${B_PROBE_NAMESERVER:127.0.0.1:9876}
b.infrastructure.mq.source=${AB_V2_RPC_SOURCE:s01}
b.infrastructure.mq.channel=${AB_V2_RPC_CHANNEL:c01}
b.infrastructure.mq.product-topic=B_PRODUCT_EVENTS-dev
b.infrastructure.mq.result-topic=A_INTEGRATION_RESULTS-dev
b.infrastructure.mq.team-topic=A_TEAM_EVENTS-dev
b.infrastructure.mq.result-consumer-group=B_INTEGRATION_RESULTS-dev
# Existing loopback Broker development exception, never imported by the normal app.
b.infrastructure.mq.use-tls=false
b.infrastructure.mq.allow-plaintext-loopback=true
b.infrastructure.database.enabled=false
server.address=127.0.0.1
server.port=0
spring.main.banner-mode=off
logging.level.org.apache.dubbo=ERROR
logging.level.org.apache.rocketmq=WARN
